<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(97% 0.004 75);} a{color:oklch(48% 0.09 78);text-decoration:none;}</style>
</helmet>
<div style="min-height:100vh;display:flex;font-family:'Work Sans',sans-serif;color:oklch(24% 0.02 50);background:oklch(97% 0.004 75)">
  <aside style="width:230px;flex-shrink:0;background:oklch(20% 0.015 50);color:oklch(90% 0.006 75);padding:28px 18px;display:flex;flex-direction:column;gap:4px">
    <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;font-weight:600;margin-bottom:8px;padding:0 8px">Meram<span style="color:oklch(66% 0.1 75)">.</span></div>
    <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:oklch(66% 0.1 75);margin-bottom:28px;padding:0 8px">Admin</div>
    <a href="admin.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;color:oklch(85% 0.006 75)">Dashboard</a>
    <a href="admin-temalar.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;color:oklch(85% 0.006 75)">Temalar</a>
    <a href="admin-siparisler.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;color:oklch(85% 0.006 75)">Siparişler</a>
    <a href="admin-kullanicilar.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;background:oklch(30% 0.02 55);color:oklch(96% 0.006 75)">Kullanıcılar</a>
    <div style="margin-top:auto;padding:0 8px;font-size:12px;color:oklch(60% 0.01 60)">admin@meram.co</div>
  </aside>
  <main style="flex:1;padding:40px 48px;max-width:1300px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px">
      <h1 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:32px;margin:0">Kullanıcılar</h1>
      <input placeholder="Kullanıcı ara..." style="width:240px;padding:10px 14px;border:1px solid oklch(88% 0.01 70);border-radius:6px;font-size:13px;background:oklch(99% 0.002 75)"></input>
    </div>
    <div style="background:oklch(99% 0.002 75);border:1px solid oklch(88% 0.01 70);border-radius:10px;overflow:hidden">
      <div style="display:grid;grid-template-columns:1.6fr 2fr 1fr 1fr 1fr;padding:14px 20px;font-size:12px;letter-spacing:0.03em;text-transform:uppercase;color:oklch(48% 0.015 50);border-bottom:1px solid oklch(88% 0.01 70)">
        <div>Ad Soyad</div><div>E-posta</div><div>Davetiye</div><div>Durum</div><div>İşlem</div>
      </div>
      <sc-for list="{{ users }}" as="u" hint-placeholder-count="6">
        <div style="display:grid;grid-template-columns:1.6fr 2fr 1fr 1fr 1fr;padding:14px 20px;font-size:13.5px;border-bottom:1px solid oklch(92% 0.005 70);align-items:center">
          <div>{{ u.name }}</div><div style="color:oklch(48% 0.015 50)">{{ u.email }}</div><div>{{ u.invitations }}</div>
          <div><span style="font-size:11px;background:{{ u.badgeBg }};color:{{ u.badgeColor }};padding:3px 10px;border-radius:10px">{{ u.status }}</span></div>
          <div style="display:flex;gap:10px"><span style="cursor:pointer;color:oklch(52% 0.1 75)">Görüntüle</span><span style="cursor:pointer;color:oklch(60% 0.01 60)">Askıya Al</span></div>
        </div>
      </sc-for>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const raw = [
      { name:'Elif Kaya', email:'elif@eposta.com', invitations:1, active:true },
      { name:'Sude Aksoy', email:'sude@eposta.com', invitations:1, active:true },
      { name:'Mert Demir', email:'mert@eposta.com', invitations:2, active:true },
      { name:'Ada Yıldız', email:'ada@eposta.com', invitations:1, active:false },
      { name:'Onur Şahin', email:'onur@eposta.com', invitations:1, active:true },
      { name:'Naz Türk', email:'naz@eposta.com', invitations:1, active:true },
    ];
    return { users: raw.map(u=>({ ...u, status: u.active?'Aktif':'Askıda', badgeBg: u.active?'oklch(88% 0.06 145)':'oklch(90% 0.02 30)', badgeColor: u.active?'oklch(35% 0.08 145)':'oklch(45% 0.1 30)' })) };
  }
}

</script>
</body>
</html>
