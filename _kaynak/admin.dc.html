<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(97% 0.004 75);} a{color:oklch(48% 0.09 78);text-decoration:none;}</style>
</helmet>
<div style="min-height:100vh;display:flex;font-family:'Work Sans',sans-serif;color:oklch(24% 0.02 50);background:oklch(97% 0.004 75)">
  <aside style="width:230px;flex-shrink:0;background:oklch(20% 0.015 50);color:oklch(90% 0.006 75);padding:28px 18px;display:flex;flex-direction:column;gap:4px">
    <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;font-weight:600;margin-bottom:8px;padding:0 8px">Meram<span style="color:oklch(66% 0.1 75)">.</span></div>
    <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:oklch(66% 0.1 75);margin-bottom:28px;padding:0 8px">Admin</div>
    <a href="admin.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;background:oklch(30% 0.02 55);color:oklch(96% 0.006 75)">Dashboard</a>
    <a href="admin-temalar.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;color:oklch(85% 0.006 75)">Temalar</a>
    <a href="admin-siparisler.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;color:oklch(85% 0.006 75)">Siparişler</a>
    <a href="admin-kullanicilar.dc.html" style="padding:11px 12px;border-radius:6px;font-size:14px;color:oklch(85% 0.006 75)">Kullanıcılar</a>
    <div style="margin-top:auto;padding:0 8px;font-size:12px;color:oklch(60% 0.01 60)">admin@meram.co</div>
  </aside>
  <main style="flex:1;padding:40px 48px;max-width:1300px">
    <h1 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:32px;margin:0 0 32px">Dashboard</h1>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:36px">
      <div style="background:oklch(99% 0.002 75);border:1px solid oklch(88% 0.01 70);border-radius:10px;padding:22px"><div style="font-size:12px;color:oklch(48% 0.015 50);margin-bottom:8px">Bu Ay Satış</div><div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">₺284.600</div></div>
      <div style="background:oklch(99% 0.002 75);border:1px solid oklch(88% 0.01 70);border-radius:10px;padding:22px"><div style="font-size:12px;color:oklch(48% 0.015 50);margin-bottom:8px">Sipariş Sayısı</div><div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">168</div></div>
      <div style="background:oklch(99% 0.002 75);border:1px solid oklch(88% 0.01 70);border-radius:10px;padding:22px"><div style="font-size:12px;color:oklch(48% 0.015 50);margin-bottom:8px">Yeni Kullanıcı</div><div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">96</div></div>
      <div style="background:oklch(99% 0.002 75);border:1px solid oklch(88% 0.01 70);border-radius:10px;padding:22px"><div style="font-size:12px;color:oklch(48% 0.015 50);margin-bottom:8px">Aktif Davetiye</div><div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">1.940</div></div>
    </div>

    <div style="background:oklch(99% 0.002 75);border:1px solid oklch(88% 0.01 70);border-radius:10px;padding:24px;margin-bottom:32px">
      <div style="font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:oklch(48% 0.015 50);margin-bottom:20px">Son 30 Gün Satış</div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:120px">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="20">
          <div style="flex:1;background:oklch(66% 0.1 75);border-radius:2px 2px 0 0;height:{{ b.h }}"></div>
        </sc-for>
      </div>
    </div>

    <div style="font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:oklch(48% 0.015 50);margin-bottom:14px">Son Siparişler</div>
    <div style="background:oklch(99% 0.002 75);border:1px solid oklch(88% 0.01 70);border-radius:10px;overflow:hidden">
      <div style="display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr;padding:14px 20px;font-size:12px;letter-spacing:0.03em;text-transform:uppercase;color:oklch(48% 0.015 50);border-bottom:1px solid oklch(88% 0.01 70)">
        <div>Kullanıcı</div><div>Paket</div><div>Tutar</div><div>Durum</div><div>Tarih</div>
      </div>
      <sc-for list="{{ orders }}" as="o" hint-placeholder-count="5">
        <div style="display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr;padding:14px 20px;font-size:13.5px;border-bottom:1px solid oklch(92% 0.005 70);align-items:center">
          <div>{{ o.user }}</div><div>{{ o.pkg }}</div><div>{{ o.amount }}</div>
          <div><span style="font-size:11px;background:{{ o.badgeBg }};color:{{ o.badgeColor }};padding:3px 10px;border-radius:10px">{{ o.status }}</span></div>
          <div style="color:oklch(48% 0.015 50)">{{ o.date }}</div>
        </div>
      </sc-for>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const heights = [40,55,35,60,72,50,45,80,65,58,70,90,60,55,75,68,82,60,95,78];
    const orders = [
      { user:'Elif Kaya', pkg:'Standart', amount:'₺1.790', status:'Ödendi', date:'07 Ağu' },
      { user:'Sude Aksoy', pkg:'Premium', amount:'₺2.990', status:'Ödendi', date:'06 Ağu' },
      { user:'Mert Demir', pkg:'Başlangıç', amount:'₺990', status:'Beklemede', date:'06 Ağu' },
      { user:'Ada Yıldız', pkg:'Standart', amount:'₺1.790', status:'İade', date:'05 Ağu' },
      { user:'Onur Şahin', pkg:'Premium', amount:'₺2.990', status:'Ödendi', date:'04 Ağu' },
    ];
    const badge = { 'Ödendi':['oklch(88% 0.06 145)','oklch(35% 0.08 145)'], 'Beklemede':['oklch(92% 0.05 85)','oklch(45% 0.09 75)'], 'İade':['oklch(90% 0.02 30)','oklch(45% 0.1 30)'] };
    return {
      bars: heights.map(h=>({ h: h+'%' })),
      orders: orders.map(o=>({ ...o, badgeBg: badge[o.status][0], badgeColor: badge[o.status][1] })),
    };
  }
}

</script>
</body>
</html>
