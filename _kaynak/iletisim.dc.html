      <nav style="display:flex;gap:20px;min-width:0;overflow:hidden">

        <span style="width:18px;height:18px;border:1.5px solid oklch(52% 0.1 75);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:oklch(52% 0.1 75);font-style:normal">M</span>
        Meram

      <nav style="display:flex;gap:20px;justify-content:flex-end;align-items:center;min-width:0;overflow:hidden">

  <main style="flex:1;max-width:1100px;margin:0 auto;padding:90px 24px 110px;display:grid;grid-template-columns:1fr 1fr;gap:64px">

  </footer>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sent:false };
  renderVals(){
    return { sendMessage: () => this.setState({ sent:true }), sendLabel: this.state.sent ? 'Mesajınız Alındı ✓' : 'Mesajı Gönder' };
  }
}

</script>
