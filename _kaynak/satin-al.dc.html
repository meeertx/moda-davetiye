<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(98% 0.006 75);} a{color:oklch(48% 0.09 78);text-decoration:none;} a:hover{color:oklch(38% 0.09 78);} input{font-family:'Work Sans',sans-serif;}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;font-family:'Work Sans',sans-serif;color:oklch(24% 0.02 50);background:oklch(98% 0.006 75)">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:22px 56px;border-bottom:1px solid oklch(89% 0.01 65)">
    <a href="Dijital Davetiye Platformu.dc.html" style="font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;font-weight:600;color:oklch(24% 0.02 50)">Meram<span style="color:oklch(52% 0.1 75)">.</span></a>
    <div style="font-size:13px;color:oklch(48% 0.015 50)">Güvenli Ödeme 🔒</div>
  </header>
  <main style="flex:1;padding:56px 56px 100px;max-width:1100px;margin:0 auto;width:100%;box-sizing:border-box;display:grid;grid-template-columns:1fr 380px;gap:56px">
    <div>
      <h1 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:32px;margin:0 0 32px">Sipariş Özeti</h1>
      <div style="display:flex;gap:16px;padding:20px;background:oklch(99% 0.004 80);border:1px solid oklch(89% 0.01 65);border-radius:4px;margin-bottom:32px">
        <div style="width:70px;height:88px;flex-shrink:0;background:{{ theme.stripe }};border-radius:2px"></div>
        <div>
          <div style="font-size:11px;text-transform:uppercase;color:oklch(52% 0.1 75);margin-bottom:4px">{{ theme.categoryLabel }}</div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600">{{ theme.name }}</div>
          <div style="font-size:13px;color:oklch(48% 0.015 50)">{{ pkg.name }} paket</div>
        </div>
      </div>
      <div style="font-size:13px;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:16px">Hesap Bilgileri</div>
      <div style="display:flex;flex-direction:column;gap:14px;margin-bottom:32px">
        <input placeholder="Ad Soyad" style="padding:12px 14px;border:1px solid oklch(89% 0.01 65);border-radius:2px;font-size:14px;background:oklch(99% 0.004 80)"></input>
        <input type="email" placeholder="E-posta" style="padding:12px 14px;border:1px solid oklch(89% 0.01 65);border-radius:2px;font-size:14px;background:oklch(99% 0.004 80)"></input>
      </div>
      <div style="font-size:13px;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:16px">Kart Bilgileri</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <input placeholder="Kart Numarası" style="padding:12px 14px;border:1px solid oklch(89% 0.01 65);border-radius:2px;font-size:14px;background:oklch(99% 0.004 80)"></input>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <input placeholder="AA/YY" style="padding:12px 14px;border:1px solid oklch(89% 0.01 65);border-radius:2px;font-size:14px;background:oklch(99% 0.004 80)"></input>
          <input placeholder="CVC" style="padding:12px 14px;border:1px solid oklch(89% 0.01 65);border-radius:2px;font-size:14px;background:oklch(99% 0.004 80)"></input>
        </div>
        <div style="display:flex;gap:10px">
          <input placeholder="Kupon kodu" style="flex:1;padding:12px 14px;border:1px solid oklch(89% 0.01 65);border-radius:2px;font-size:14px;background:oklch(99% 0.004 80)"></input>
          <button style="cursor:pointer;padding:12px 18px;border:1px solid oklch(24% 0.02 50);background:transparent;border-radius:2px;font-size:13px">Uygula</button>
        </div>
      </div>
    </div>
    <div>
      <div style="background:oklch(24% 0.02 50);color:oklch(96% 0.006 75);padding:28px;border-radius:6px;position:sticky;top:32px">
        <div style="font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:oklch(66% 0.1 75);margin-bottom:18px">Ödeme Özeti</div>
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px"><span>{{ pkg.name }} Paket</span><span>{{ pkg.price }}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:14px;color:oklch(75% 0.008 75);margin-bottom:20px"><span>KDV dahil</span><span>—</span></div>
        <div style="border-top:1px solid oklch(40% 0.01 60);padding-top:20px;display:flex;justify-content:space-between;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:24px"><span>Toplam</span><span>{{ pkg.price }}</span></div>
        <a href="odeme-basarili.dc.html?slug={{ slug }}" style="display:block;text-align:center;background:oklch(96% 0.006 75);color:oklch(24% 0.02 50);padding:15px;border-radius:2px;font-size:14px;margin-bottom:10px">Ödemeyi Tamamla</a>
        <a href="odeme-basarisiz.dc.html" style="display:block;text-align:center;color:oklch(75% 0.008 75);font-size:12px">(demo: başarısız senaryo)</a>
      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const THEMES = {
  'belle-epoque': { name:'Belle Époque', categoryLabel:'Düğün', stripe:'repeating-linear-gradient(45deg, oklch(93% 0.02 78) 0 12px, oklch(97% 0.012 78) 12px 24px)' },
  'kalp-cizgisi': { name:'Kalp Çizgisi', categoryLabel:'Düğün', stripe:'repeating-linear-gradient(90deg, oklch(95% 0.006 75) 0 16px, oklch(98% 0.004 75) 16px 32px)' },
  'zeytin-bahcesi': { name:'Zeytin Bahçesi', categoryLabel:'Nişan', stripe:'repeating-linear-gradient(45deg, oklch(88% 0.05 140) 0 12px, oklch(94% 0.03 140) 12px 24px)' },
  'kirmizi-kina': { name:'Kırmızı Kına', categoryLabel:'Kına', stripe:'repeating-linear-gradient(45deg, oklch(45% 0.14 25) 0 12px, oklch(50% 0.13 25) 12px 24px)' },
  'soz-vakti': { name:'Söz Vakti', categoryLabel:'Save the Date', stripe:'repeating-linear-gradient(90deg, oklch(30% 0.04 260) 0 14px, oklch(35% 0.035 260) 14px 28px)' },
  'mermer-yaldiz': { name:'Mermer & Yaldız', categoryLabel:'Düğün', stripe:'repeating-linear-gradient(120deg, oklch(20% 0.01 50) 0 10px, oklch(26% 0.015 50) 10px 20px, oklch(20% 0.01 50) 20px 30px)' },
  'nisan-cemberi': { name:'Nişan Çemberi', categoryLabel:'Nişan', stripe:'repeating-linear-gradient(45deg, oklch(90% 0.04 20) 0 12px, oklch(95% 0.025 20) 12px 24px)' },
};
const PACKAGES = { baslangic:{name:'Başlangıç',price:'₺990'}, standart:{name:'Standart',price:'₺1.790'}, premium:{name:'Premium',price:'₺2.990'} };
class Component extends DCLogic {
  state = { slug:'belle-epoque', paket:'standart' };
  componentDidMount(){
    const q = new URLSearchParams(window.location.search);
    const s = q.get('slug'), p = q.get('paket');
    this.setState({ slug: THEMES[s] ? s : this.state.slug, paket: PACKAGES[p] ? p : this.state.paket });
  }
  renderVals(){
    return { theme: THEMES[this.state.slug], pkg: PACKAGES[this.state.paket], slug: this.state.slug };
  }
}

</script>
</body>
</html>
