<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(98% 0.006 75);} a{color:oklch(48% 0.09 78);text-decoration:none;}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;font-family:'Work Sans',sans-serif;color:oklch(24% 0.02 50);background:oklch(98% 0.006 75)">
  <header style="position:sticky;top:0;z-index:50;background:oklch(98% 0.006 75 / 0.95);backdrop-filter:blur(8px);border-bottom:1px solid oklch(89% 0.01 65)">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px;padding:18px 32px;max-width:1600px;margin:0 auto">
      <nav style="display:flex;gap:20px;min-width:0;overflow:hidden">
        <a href="Dijital Davetiye Platformu.dc.html" style="font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(40% 0.015 50);white-space:nowrap">Ana Sayfa</a>
        <a href="tasarimlar.dc.html" style="font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(40% 0.015 50);white-space:nowrap">Tasarımlar</a>
        <a href="fiyatlar.dc.html" style="font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(40% 0.015 50);white-space:nowrap">Fiyatlar</a>
      </nav>
      <a href="Dijital Davetiye Platformu.dc.html" style="display:flex;align-items:center;gap:7px;font-family:'Cormorant Garamond',serif;font-size:23px;font-style:italic;font-weight:600;color:oklch(24% 0.02 50);white-space:nowrap;justify-self:center">
        <span style="width:18px;height:18px;border:1.5px solid oklch(52% 0.1 75);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:oklch(52% 0.1 75);font-style:normal">M</span>
        Meram
      </a>
      <nav style="display:flex;gap:20px;justify-content:flex-end;align-items:center;min-width:0;overflow:hidden">
        <a href="iletisim.dc.html" style="font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(40% 0.015 50);white-space:nowrap">İletişim</a>
        <a href="yorumlar.dc.html" style="font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(24% 0.02 50);font-weight:600;white-space:nowrap">Yorumlar</a>
        <a href="hakkimizda.dc.html" style="font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(40% 0.015 50);white-space:nowrap">Hakkımızda</a>
        <div style="width:1px;height:14px;background:oklch(89% 0.01 65);flex-shrink:0"></div>
        <a href="giris.dc.html" style="font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(24% 0.02 50);white-space:nowrap">Giriş Yap</a>
      </nav>
    </div>
  </header>
  <main style="flex:1;max-width:1100px;margin:0 auto;padding:90px 24px 110px">
    <div style="text-align:center;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(52% 0.1 75);margin-bottom:18px">Yorumlar</div>
    <h1 style="text-align:center;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:38px;margin:0 0 56px">Çiftlerimiz Ne Diyor</h1>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px">
      <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="6">
        <div style="background:oklch(99% 0.004 80);border:1px solid oklch(89% 0.01 65);border-radius:6px;padding:26px">
          <div style="color:oklch(66% 0.1 75);margin-bottom:14px;font-size:14px">★★★★★</div>
          <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;line-height:1.6;margin:0 0 16px">"{{ r.quote }}"</p>
          <div style="font-size:13px;color:oklch(48% 0.015 50)">{{ r.author }}</div>
        </div>
      </sc-for>
    </div>
  </main>
  <footer style="margin-top:auto;padding:40px 56px;background:oklch(24% 0.02 50);color:oklch(70% 0.008 75);display:flex;justify-content:space-between;font-size:13px">
    <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:oklch(96% 0.006 75)">Meram.</div>
    <div>© 2026 Meram Davetiye</div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    return { reviews: [
      { quote:'Davetiyemizi açan herkes önce şaşırdı, sonra bayıldı. RSVP takibi de inanılmaz pratikti.', author:'Elif & Kaan, İstanbul' },
      { quote:'Kına gecemiz için seçtiğimiz tema tam istediğimiz enerjiyi verdi.', author:'Sude, Kına Sahibi' },
      { quote:'Editör adım adım ilerlediği için hiç kafam karışmadı, 20 dakikada yayına aldım.', author:'Mert & Ada, İzmir' },
      { quote:'Misafirlerimiz linkten müziğe kadar her şeyi çok beğendi.', author:'Naz & Onur, İzmir' },
      { quote:'Fiyatına göre kalitesi gerçekten şaşırtıcı, kesinlikle öneririm.', author:'Deniz, Ankara' },
      { quote:'RSVP istatistikleri sayesinde organizasyonu çok daha kolay yönettik.', author:'Ada & Kerem, Bodrum' },
    ] };
  }
}

</script>
</body>
</html>
